name: Build Rust Fetcher and Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Fetcher
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          cargo run --release

      - name: Compress Output
        run: |
          tar -czvf bnb_addresses_$(date +'%Y%m%d_%H%M%S').tar.gz bnb_unique_addresses.csv

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}
          name: "BNB Addresses Dump (Rust Engine) - ${{ github.run_id }}"
          body: "Automated dump generated by Rust fetcher."
          files: |
            *.tar.gz
            bnb_unique_addresses.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
