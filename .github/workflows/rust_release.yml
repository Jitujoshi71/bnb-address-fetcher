name: Batch Fetch BNB Addresses & Release

on:
  workflow_dispatch:

jobs:
  run-batch-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Execute Historical Batch Fetcher
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          cargo run --release

      - name: Upload Output Parts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bnb-full-dump-${{ github.run_id }}
          name: "BNB Historical Address Dump (Batch Export)"
          body: "Full historical batch export of BNB unique addresses generated via Rust."
          files: |
            *.csv.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
