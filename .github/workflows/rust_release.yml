name: Batch Fetch BNB Addresses & Immediate Release

on:
  workflow_dispatch:

jobs:
  run-batch-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Create Base GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="bnb-dump-$(date +'%Y%m%d_%H%M%S')"
          gh release create "$TAG_NAME" --title "BNB Historical Address Dump ($TAG_NAME)" --notes "Live real-time batch uploads of BNB unique addresses."
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Execute Real-time Batch Fetcher
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          cargo run --release
