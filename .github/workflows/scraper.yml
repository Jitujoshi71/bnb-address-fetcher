name: BNB Address Scraper

on:
  workflow_dispatch:
    inputs:
      start_block:
        description: 'Start Block Number'
        required: true
        default: '35000000'
      end_block:
        description: 'End Block Number'
        required: true
        default: '35010000'
      block_step:
        description: 'Blocks per batch'
        required: true
        default: '1000'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="data-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG_NAME" --title "BNB Address Dump $TAG_NAME" --notes "Automated scrape for blocks ${{ inputs.start_block }} to ${{ inputs.end_block }}"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Build and Run Scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
          BLOCK_STEP: ${{ inputs.block_step }}
        run: |
          cargo run --release
